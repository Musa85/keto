<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كيتو — دليلي الشامل</title>
<meta name="description" content="دليل كيتو عربي شامل: رحلة المراحل الثلاث، وصفات التجميد للعمل، الطبخ المباشر، مكمّلات الوجبات، وسناكات البروتين.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Cairo:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F0D0A; --bg2:#171410; --card:#1C1813; --card2:#242019; --line:#2E2820; --line2:#3A332A;
  --txt:#EDE6DA; --txt2:#B5AA98; --txt3:#7E7565;
  --strict:#C85A4A; --strict-glow:rgba(200,90,74,.16);
  --normal:#E8A33D; --normal-glow:rgba(232,163,61,.16);
  --lifestyle:#7FA86B; --lifestyle-glow:rgba(127,168,107,.16);
  --acc:#E8A33D; --acc-glow:rgba(232,163,61,.16);
  --ok:#7FA86B; --warn:#E8A33D; --bad:#C85A4A;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Cairo',sans-serif;font-size:15px;line-height:1.7;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(1100px 500px at 85% -10%,var(--acc-glow),transparent 60%);pointer-events:none;z-index:0;transition:background .5s}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px 80px;position:relative;z-index:1}
h1,h2,h3,h4{font-family:'Reem Kufi',sans-serif;line-height:1.5}
.mono{font-family:'JetBrains Mono',monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::placeholder{color:var(--txt3)}

/* ===== Header ===== */
header{padding:34px 0 10px;text-align:center}
.logo{font-family:'Reem Kufi',sans-serif;font-size:30px;font-weight:700;letter-spacing:.5px}
.logo .k{color:var(--acc);transition:color .4s}
.tagline{color:var(--txt2);font-size:13.5px;margin-top:2px}
.phase-switch{display:flex;justify-content:center;gap:8px;margin:18px 0 4px;flex-wrap:wrap}
.phase-switch .lbl{width:100%;font-size:12px;color:var(--txt3);margin-bottom:-2px}
.pbtn{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--txt2);font-size:13.5px;font-weight:600;transition:.25s}
.pbtn:hover{border-color:var(--line2);color:var(--txt)}
.pbtn.on{color:var(--txt);border-color:var(--pc);background:linear-gradient(0deg,var(--pg),var(--pg)),var(--card);box-shadow:0 0 18px var(--pg)}
.pbtn .dot{width:9px;height:9px;border-radius:50%;background:var(--pc)}
.pbtn.on .dot{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--pg)}50%{box-shadow:0 0 0 6px transparent}}
.phase-note{max-width:640px;margin:10px auto 0;font-size:13px;color:var(--txt2);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 16px}

/* ===== Nav ===== */
.navbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,var(--bg) 75%,transparent);padding:10px 0 12px;margin-top:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:2px;justify-content:center}
.tab{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt2);font-size:13.5px;font-weight:600;transition:.2s;white-space:nowrap}
.tab:hover{color:var(--txt);border-color:var(--line2)}
.tab.on{color:var(--txt);border-color:var(--acc);background:linear-gradient(0deg,var(--acc-glow),var(--acc-glow)),var(--card)}
.tab .n{font-size:11px;color:var(--txt3);background:var(--bg);padding:0 7px;border-radius:8px}
.searchrow{display:flex;gap:8px;margin-top:9px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:14px}
.favtoggle{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt2);font-size:13px;font-weight:600;transition:.2s}
.favtoggle.on{color:#F4C95D;border-color:#F4C95D55;background:#F4C95D11}

/* ===== Sections ===== */
.pane{display:none;animation:fadein .25s}
.pane.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-title{display:flex;align-items:center;gap:10px;font-size:20px;margin:30px 0 6px}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(270deg,transparent,var(--line2))}
.sec-sub{color:var(--txt2);font-size:13.5px;margin-bottom:14px;max-width:760px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.fchip{padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--txt2);font-size:12.5px;font-weight:600;transition:.2s}
.fchip:hover{color:var(--txt)}
.fchip.on{color:var(--txt);border-color:var(--acc);background:linear-gradient(0deg,var(--acc-glow),var(--acc-glow)),var(--card)}
.empty{text-align:center;color:var(--txt3);padding:40px 0;font-size:14px}

/* ===== Cards grid ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .2s}
.card:hover{border-color:var(--line2)}
.card.open{border-color:var(--acc)}
.chead{display:flex;align-items:flex-start;gap:11px;padding:14px 15px 4px;cursor:pointer}
.cemoji{font-size:26px;line-height:1.2;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.cname{font-weight:700;font-size:15px;line-height:1.45}
.cdesc{font-size:12.5px;color:var(--txt2);line-height:1.55;margin-top:2px}
.cfav{margin-inline-start:auto;font-size:17px;opacity:.35;transition:.2s;padding:2px 4px}
.cfav:hover{opacity:.8;transform:scale(1.12)}
.cfav.on{opacity:1}
.cbadges{display:flex;flex-wrap:wrap;gap:5px;padding:9px 15px 0;cursor:pointer}
.chip{font-size:11px;font-weight:600;padding:2.5px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--txt2);background:var(--bg2)}
.chip.acc{color:var(--acc);border-color:var(--acc)}
.chip.ok{color:var(--ok);border-color:#7FA86B55;background:rgba(127,168,107,.08)}
.chip.warn{color:var(--warn);border-color:#E8A33D55;background:rgba(232,163,61,.08)}
.chip.bad{color:var(--bad);border-color:#C85A4A55;background:rgba(200,90,74,.08)}
.chip.whey{color:#8FB7D9;border-color:#8FB7D955;background:#8FB7D911}
.chip.beef{color:#C98FD9;border-color:#C98FD955;background:#C98FD911}
.macros{display:flex;gap:6px;padding:10px 15px 13px;cursor:pointer}
.mx{flex:1;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:5px 2px}
.mx b{display:block;font-family:'JetBrains Mono',monospace;font-size:13.5px;color:var(--txt)}
.mx span{font-size:10px;color:var(--txt3)}
.mx.kc b{color:var(--acc)}
.mcap{text-align:center;font-size:10.5px;color:var(--txt3);margin:-4px 0 9px;padding:0 15px}
.cbody{display:none;border-top:1px dashed var(--line2);padding:13px 15px 15px;font-size:13px}
.card.open .cbody{display:block}
.cbody h4{font-size:12.5px;color:var(--acc);margin:10px 0 5px;display:flex;align-items:center;gap:6px}
.cbody h4:first-child{margin-top:0}
.cbody ul,.cbody ol{padding-inline-start:20px;display:grid;gap:3px;color:var(--txt2)}
.cbody ol li::marker{color:var(--acc);font-weight:700}
.cbody ul li::marker{color:var(--txt3)}
.alts{font-size:11.5px;color:var(--txt3)}
.notebox{margin-top:11px;background:var(--bg2);border:1px solid var(--line);border-inline-start:3px solid var(--acc);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--txt2)}
.pairrow{margin-top:11px;font-size:12.5px;color:var(--txt2)}
.pairrow b{color:var(--txt)}

/* ===== Journey ===== */
.jgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.jcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden;transition:.25s}
.jcard::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--jc)}
.jcard.cur{border-color:var(--jc);box-shadow:0 0 24px var(--jg)}
.jcard .jph{display:flex;align-items:center;gap:9px;font-family:'Reem Kufi',sans-serif;font-size:17px;font-weight:700}
.jcard .jgoal{display:inline-block;margin:8px 0;font-size:11.5px;font-weight:700;color:var(--jc);border:1px solid var(--jc);border-radius:99px;padding:2px 11px}
.jcard p{font-size:13px;color:var(--txt2)}
.jcard .jdur{margin-top:10px;font-size:12px;color:var(--txt3)}
.jcard .jdur b{color:var(--txt2)}
.jcard .youare{position:absolute;top:12px;inset-inline-end:14px;font-size:10.5px;font-weight:700;color:var(--jc);background:var(--jg);padding:2px 10px;border-radius:99px}
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.sign{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px}
.sign .se{font-size:20px}
.sign b{display:block;font-size:13px}
.sign span{color:var(--txt2);font-size:12px;line-height:1.55}
.gitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.gitem .gn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;flex-wrap:wrap}
.gpills{display:flex;gap:5px;margin-inline-start:auto;flex-wrap:wrap}
.gpill{font-size:10.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);background:var(--bg2);display:flex;gap:4px;align-items:center}
.gpill .pl{color:var(--txt3)}
.gpill.focus{border-color:var(--acc)}
.gpill.dim{opacity:.55}
.pv-yes{color:var(--ok);font-weight:700}.pv-cond{color:var(--warn);font-weight:700}.pv-no{color:var(--bad);font-weight:700}
.gcond{font-size:12px;color:var(--txt2);margin-top:5px}
.gcond .ck{color:var(--warn);font-weight:700}
.gphase{font-size:12px;margin-top:5px;color:var(--txt2);background:var(--bg2);border-radius:8px;padding:5px 10px;border-inline-start:3px solid var(--acc)}
.gcat-title{display:flex;align-items:center;gap:8px;font-size:15px;margin:20px 0 8px;color:var(--txt)}
.glist{display:grid;gap:8px}
.swap{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.swap .sfrom,.swap .sto{text-align:center;font-size:13px;font-weight:700}
.swap .sfrom{color:var(--bad)}
.swap .sto{color:var(--ok)}
.swap .sarrow{color:var(--txt3);font-size:18px}
.swap .show-{grid-column:1/-1;font-size:12.5px;color:var(--txt2);border-top:1px dashed var(--line);padding-top:9px}
.swap .sk{color:var(--acc);font-weight:700}
.swapcat{font-size:13.5px;color:var(--txt2);margin:18px 0 8px;font-weight:700}

/* ===== أقسام قابلة للطي (رحلتي) ===== */
.jsec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.jsec .jsum{width:100%;display:flex;align-items:center;gap:10px;padding:14px 17px;font-family:'Reem Kufi',sans-serif;font-size:16px;font-weight:700;color:var(--txt);text-align:start;cursor:pointer;transition:.2s}
.jsec .jsum:hover{background:var(--card2)}
.jsec.open .jsum{color:var(--acc)}
.jcount{font-size:10.5px;color:var(--txt3);background:var(--bg2);border:1px solid var(--line);padding:1px 9px;border-radius:99px;font-family:'Cairo',sans-serif;font-weight:600}
.jarr{margin-inline-start:auto;color:var(--txt3);transition:transform .25s;font-size:15px}
.jsec.open .jarr{transform:rotate(180deg)}
.jsec .jbody{display:none;padding:2px 16px 16px;border-top:1px dashed var(--line)}
.jsec.open .jbody{display:block;animation:fadein .25s}
.jsec .jbody .sec-sub{margin-top:10px}
.jsec .jbody .signs,.jsec .jbody .jgrid,.jsec .jbody .glist{margin-top:10px}

/* ===== Sides ===== */
.sgroup-title{display:flex;align-items:center;gap:9px;font-size:16px;margin:24px 0 10px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.scard .sn{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.scard .sd{font-size:12.5px;color:var(--txt2);margin-top:3px}
.scard .show{font-size:12px;color:var(--txt2);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.scard .show b{color:var(--acc)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;align-items:start}

/* ===== Shopping ===== */
.shopwrap{margin-top:26px}
details.shop{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
details.shop summary{cursor:pointer;padding:13px 16px;font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:9px;list-style:none}
details.shop summary::-webkit-details-marker{display:none}
details.shop summary::after{content:'⌄';margin-inline-start:auto;color:var(--txt3);transition:.2s}
details.shop[open] summary::after{transform:rotate(180deg)}
.shopitem{border-top:1px solid var(--line);padding:11px 16px}
.shopitem .in{font-weight:700;font-size:13.5px}
.shopitem .iq{color:var(--txt3);font-size:12px;font-weight:400}
.shopitem .ia{font-size:12px;color:var(--txt2);margin-top:2px}
.shopitem .iw{font-size:12px;color:var(--txt2);margin-top:2px}
.shopitem .iw .bad{color:var(--bad);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.tool{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 13px;color:var(--txt2)}

/* ===== Misc ===== */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card2);border:1px solid var(--acc);color:var(--txt);padding:10px 22px;border-radius:99px;font-size:13.5px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
footer{margin-top:60px;text-align:center;color:var(--txt3);font-size:12.5px;border-top:1px solid var(--line);padding-top:22px}
footer a{color:var(--txt2)}
.topbtn{position:fixed;bottom:22px;inset-inline-end:18px;width:42px;height:42px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);color:var(--txt2);font-size:18px;z-index:60;opacity:0;transition:.3s;pointer-events:none}
.topbtn.show{opacity:1;pointer-events:auto}
@media(max-width:768px){
  .navbar{transition:transform .25s ease}
  .navbar.navhide{transform:translateY(-115%)}
  .tabs{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:8px 12px;font-size:12.5px}
  .searchrow{margin-top:7px}
}
@media(max-width:560px){
  .grid{grid-template-columns:1fr}
  .card.open{grid-row:auto}
  .swap{grid-template-columns:1fr;gap:4px}
  .swap .sarrow{transform:rotate(90deg)}
  header{padding-top:24px}
  .logo{font-size:25px}
}
@media print{
  body::before,.navbar,.topbtn,.toast,.cfav{display:none!important}
  /* احتياط لطباعة Ctrl+P بدون زر الخطة فقط — يُلغى تماماً أثناء طباعة الخطة (body.pp) */
  body:not(.pp){background:#fff;color:#000}
  body:not(.pp) .pane{display:block!important}
  body:not(.pp) .card,body:not(.pp) .cbody{display:block!important;border-color:#ccc}
}
/* ===== خطة التحضير ===== */
.addp{font-size:11px;font-weight:700;padding:2.5px 10px;border-radius:99px;border:1px solid var(--acc);color:var(--acc);background:transparent;transition:.2s}
.addp.in{background:var(--acc);color:var(--bg)}
.abtn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:12px;border:1px solid var(--acc);background:linear-gradient(0deg,var(--acc-glow),var(--acc-glow)),var(--card);color:var(--txt);font-size:13.5px;font-weight:700;transition:.2s}
.abtn:hover{box-shadow:0 0 14px var(--acc-glow)}
.abtn.ghost{border-color:var(--line2);background:var(--card);color:var(--txt2)}
.planrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.planrow .pn{font-weight:700;font-size:13.5px;flex:1}
.planrow .pt{font-size:10.5px;color:var(--txt3)}
.pstep{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:3px 6px}
.pstep button{width:24px;height:24px;border-radius:50%;background:var(--card2);color:var(--acc);font-weight:700;font-size:15px;line-height:1}
.pstep b{font-family:'JetBrains Mono',monospace;min-width:20px;text-align:center}
.prem{color:var(--bad);font-size:15px;padding:2px 6px}
.prep-block{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;break-inside:avoid}
.prep-block h3{display:flex;align-items:center;gap:9px;font-size:16px}
.prep-block .pmeta{font-size:12px;color:var(--txt2);margin:4px 0 10px}
.prep-block h4{font-size:12.5px;color:var(--acc);margin:10px 0 5px}
.prep-block ul,.prep-block ol{padding-inline-start:20px;font-size:13px;color:var(--txt2);display:grid;gap:3px}
.prep-block ol li::marker{color:var(--acc);font-weight:700}
.shopline{display:flex;align-items:flex-start;gap:9px;padding:7px 12px;border-bottom:1px dashed var(--line);font-size:13.5px;cursor:pointer}
.shopline:last-child{border-bottom:none}
.shopline .box{width:17px;height:17px;border:2px solid var(--line2);border-radius:5px;flex-shrink:0;margin-top:3px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--bg)}
.shopline.have .box{background:var(--ok);border-color:var(--ok)}
.shopline.have .st{text-decoration:line-through;color:var(--txt3)}
.shopline .samt{margin-inline-start:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--acc);white-space:nowrap}
.shopline.have .samt{color:var(--txt3);text-decoration:line-through}
.shopcat{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.shopcat .sct{padding:9px 14px;font-weight:700;font-size:13.5px;background:var(--bg2);border-bottom:1px solid var(--line)}
.havehint{font-size:12px;color:var(--txt3);margin:6px 0 10px}
.plansum{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
/* ===== مستند الطباعة الاحترافي ===== */
#printdoc{display:none}
@media print{
  @page{size:A4;margin:11mm 12mm}
  body.pp{background:#fff!important;color:#15120e}
  body.pp::before{display:none}
  body.pp .wrap,body.pp .topbtn,body.pp .toast{display:none!important}
  body.pp #printdoc{display:block;font-family:'Cairo',sans-serif;font-size:12px;line-height:1.6;color:#15120e}
  #printdoc *{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .pd-head{text-align:center;border-bottom:3px double var(--pacc);padding-bottom:10px;margin-bottom:12px}
  .pd-logo{font-family:'Reem Kufi';font-size:11px;font-weight:600;color:#8a8174;letter-spacing:2px}
  .pd-head h1{font-family:'Reem Kufi';font-size:25px;margin:2px 0 4px;color:#15120e}
  .pd-meta{font-size:11px;color:#5d564b;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
  .pd-meta b{color:var(--pacc)}
  table.pd-toc{width:100%;border-collapse:collapse;font-size:11px;margin:8px 0 2px}

const PHASE_COLORS = {
  strict:   ['#C85A4A','rgba(200,90,74,.16)'],
  normal:   ['#E8A33D','rgba(232,163,61,.16)'],
  lifestyle:['#7FA86B','rgba(127,168,107,.16)']
};
let state = { phase:'strict', tab:'journey', favs:[], favOnly:false, plan:{}, have:[] };
try { Object.assign(state, JSON.parse(localStorage.getItem(HUB_KEY) || '{}')); } catch(e){}
if (!state.plan) state.plan = {}; if (!state.have) state.have = [];
const save = () => localStorage.setItem(HUB_KEY, JSON.stringify(state));
const favSet = new Set(state.favs);
const haveSet = new Set(state.have);

// فلاتر الأقسام
let q = '';
let fzBase='all', fzOdorLow=false, fzEquip='all', fzPhaseOnly=false;
let frCat='all';
let prBase='all', prType='all', prFast=false;
let snCat='all';

const $ = s => document.querySelector(s);
const FRAC = {0.25:'¼', 0.5:'½', 0.75:'¾'};
function amtTxt(a){
  if (FRAC[a]) return FRAC[a];
  if (a % 1 !== 0){ const w = Math.floor(a), f = FRAC[+(a-w).toFixed(2)]; if (f) return (w?w:'')+f; }
  return String(a);
}
function ingLine(ing){
  const m = ING[ing.key]; if (!m) return '';
  let t = `<li><b>${m.name}</b> — ${amtTxt(ing.amt)} ${m.unit}`;
  if (ing.alts && ing.alts.length){
    t += `<br><span class="alts">أو: ${ing.alts.map(k=>ING[k]?ING[k].name:k).join('، ')}</span>`;
  }
  return t + '</li>';
}
function macroRow(kcal,p,f,c){
  return `<div class="macros">
    <div class="mx kc"><b>${kcal}</b><span>سعرة</span></div>
    <div class="mx"><b>${p}</b><span>بروتين</span></div>
    <div class="mx"><b>${f}</b><span>دهون</span></div>
    <div class="mx"><b>${c}</b><span>كارب صافٍ</span></div>
  </div>`;
}
function favBtn(uid){
  return `<button class="cfav ${favSet.has(uid)?'on':''}" data-fav="${uid}" title="مفضلة">${favSet.has(uid)?'⭐':'☆'}</button>`;
}
function planBtn(uid){
  const n = state.plan[uid];
  return `<button class="addp ${n?'in':''}" data-plan="${uid}">${n?`🛒 في الخطة ×${n}`:'🛒 + للخطة'}</button>`;
}
// تحويل uid إلى العنصر الأصلي
function resolve(uid){
  const [t, ...rest] = uid.split(':'); const id = rest.join(':');
  if (t==='fz'){ const r = RECIPES.find(r=>r.id===id); return r && {t, o:r, e:r.emoji, n:r.name, lbl:'🧊 تجميد', struct:1}; }
  if (t==='sn'){ const s = SNACKS[id]; return s && {t, o:s, e:s.emoji, n:s.name, lbl:'🥜 سناك', struct:1}; }
  if (t==='pr'){ const s = PSNACKS.find(s=>String(s.id)===id); return s && {t, o:s, e:s.e, n:s.n, lbl:'🥤 بروتين', struct:0}; }
  if (t==='fr'){ const [sec, name] = [id.slice(0, id.indexOf(':')), id.slice(id.indexOf(':')+1)];
    const S = SECTIONS.find(x=>x.title===sec); const r = S && S.recipes.find(r=>r.name===name);
    return r && {t, o:r, e:S.e, n:r.name, lbl:'🍳 مباشر', struct:0}; }
  if (t==='sd'){ const [g, name] = [id.slice(0, id.indexOf(':')), id.slice(id.indexOf(':')+1)];
    const G = SIDE_GROUPS.find(x=>x.n===g); const it = G && G.items.find(i=>i.n===name);
    return it && {t, o:it, e:it.e, n:it.n, lbl:'🥗 مكمّل', struct:0}; }
  if (t==='sc'){ const s = SAUCES.find(x=>x.id===id); return s && {t, o:s, e:s.e, n:s.name, lbl:'🥣 صوص', struct:0}; }
  return null;
}
function fmtTotal(total, unit){
  if ((unit==='جم'||unit==='مل') && total>=1000)
    return (total/1000).toFixed(2).replace(/\.?0+$/,'') + ' ' + (unit==='جم'?'كجم':'لتر');
  return (+total.toFixed(2)) + ' ' + unit;
}
function dietDots(diets){
  return diets.map(d=>PHASES[d]?PHASES[d].emoji:'').join('');
}
function toast(msg){
  const el = $('#toast'); el.textContent = msg;
  el.classList.add('show'); clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 1700);
}
function hit(txt){ return !q || (txt||'').includes(q); }
function chipRow(defs, cur, attr){
  return `<div class="chips">` + defs.map(d =>
    `<button class="fchip ${cur===d.v?'on':''}" data-${attr}="${d.v}">${d.t}</button>`).join('') + `</div>`;
}

function jsec(id, title, count, body){

function renderJourney(){
  // 1) خريطة الرحلة
  let mapB = `<p class="sec-sub">ثلاث مراحل متدرجة: ندخل الكيتوزس بالصارم، نخسر الوزن بالعادي، ونثبّت بلايف ستايل. اضغط على المرحلة لتفعيلها — يتلوّن الدليل كله حسبها.</p>
  <div class="jgrid">` + Object.values(PHASES).map(p=>{
    const [pc,pg] = PHASE_COLORS[p.key];
    return `<div class="jcard ${state.phase===p.key?'cur':''}" data-phase="${p.key}" style="--jc:${pc};--jg:${pg};cursor:pointer">
      ${state.phase===p.key?'<span class="youare">أنت هنا</span>':''}
      <div class="jph">${p.emoji} ${p.name}</div>
      <span class="jgoal">${p.goal}</span>
      <p>${p.note}</p>
      <div class="jdur">${PHASE_DUR[p.key]}</div>
    </div>`;
  }).join('') + `</div>`;

  // 2) الانتقال بين المراحل
  const transB = `<div class="signs">` +
    TRANSITIONS.map(t=>`<div class="sign"><span class="se">${t.e}</span><div><b>${t.n}</b><span>${t.d}</span></div></div>`).join('') + `</div>`;

  // 3) علامات الكيتوزس
  const signsB = `<div class="signs">` +
    KETO_SIGNS.map(s=>`<div class="sign"><span class="se">${s.e}</span><div><b>${s.n}</b><span>${s.d}</span></div></div>`).join('') + `</div>`;

  // 4) إنفلونزا الكيتو
  const fluB = `<div class="signs">` +
    KETO_FLU.map(s=>`<div class="sign"><span class="se">${s.e}</span><div><b>${s.n}</b><span>${s.d}</span></div></div>`).join('') + `</div>`;

  // 5) دليل المسموح والممنوع
  let guideB = `<p class="sec-sub">الحكم الملوّن حسب مرحلتك الحالية (${PHASES[state.phase].emoji} ${PHASES[state.phase].name}). ✓ مسموح · ⚠ مشروط · ✕ ممنوع.</p>`;
  guideB += chipRow([
    {v:'all',t:'الكل'},{v:'y',t:'✓ المسموح'},{v:'c',t:'⚠ المشروط'},{v:'n',t:'✕ الممنوع'}
  ], guideStatus, 'gstatus');
  for (const [ck, cat] of Object.entries(GUIDE_CATS)){
    const items = GUIDE_DATA.filter(it => it.cat===ck
      && (guideStatus==='all' || it.s[state.phase]===guideStatus)
      && (hit(it.n) || hit(it.cond)));
    if (!items.length) continue;
    guideB += `<h3 class="gcat-title">${cat.e} ${cat.n}</h3><div class="glist">` + items.map(it=>{
      const pills = Object.keys(GUIDE_PHASES).map(k=>{
        const m = GSMAP[it.s[k]], p = GUIDE_PHASES[k];
        const short = p.name.replace('الكيتو ','').replace('كيتو ','');
        return `<span class="gpill ${k===state.phase?'focus':'dim'}"><span class="pl">${short}</span> <span class="pv-${m.cls}">${m.sym}</span></span>`;
      }).join('');
      const pc = it.pc && it.pc[state.phase] ? `<div class="gphase">💡 ${it.pc[state.phase]}</div>` : '';
      return `<div class="gitem"><div class="gn">${it.e} ${it.n}<span class="gpills">${pills}</span></div>
        ${it.cond?`<div class="gcond">${it.cond}</div>`:''}${pc}</div>`;
    }).join('') + `</div>`;
  }

  // 6) التحويلات الذكية
  let swapsB = '', lastCat = '';
  for (const s of SWAPS.filter(s=>hit(s.from.n)||hit(s.to.n)||hit(s.how)||hit(s.cat))){
    if (s.cat !== lastCat){ swapsB += `<div class="swapcat">${s.cat}</div>`; lastCat = s.cat; }
    swapsB += `<div class="swap" style="margin-bottom:8px">
      <div class="sfrom">${s.from.e} ${s.from.n}</div><div class="sarrow">←</div>
      <div class="sto">${s.to.e} ${s.to.n}</div>
      <div class="show-">${s.how}</div>
    </div>`;
  }

  const h = jsec('map','🧭 خريطة الرحلة', '', mapB)
    + jsec('trans','🔁 متى أنتقل بين المراحل؟', TRANSITIONS.length, transB)
    + jsec('signs','🧪 علامات دخول الكيتوزس', KETO_SIGNS.length, signsB)
    + jsec('flu','🤒 إنفلونزا الكيتو وعلاجها', KETO_FLU.length, fluB)
    + jsec('guide','📋 دليل المسموح والممنوع', GUIDE_DATA.length, guideB)
    + jsec('swaps','🔄 التحويلات الذكية (ممنوع ← بديله)', SWAPS.length, swapsB);
  $('#pane-journey').innerHTML = h;
}

function scaledIngs(o, n){
  return o.ingredients.map(ing=>{
    const m = ING[ing.key]; if (!m) return '';
    return `<li><b>${m.name}</b> — ${fmtTotal(ing.amt*n, m.unit)}${ing.alts&&ing.alts.length?` <span class="alts">(أو: ${ing.alts.map(k=>ING[k]?ING[k].name:k).join('، ')})</span>`:''}</li>`;
  }).join('');
}
function prepBlock(uid, n){
  const r = resolve(uid); if (!r) return '';
  const o = r.o;
  let h = `<div class="prep-block"><h3>${r.e} ${r.n} <span class="chip acc">×${n} ${n>2?'حصص':'حصة'}</span></h3>`;
  if (r.t==='fz') h += `<div class="pmeta">${r.lbl} · ⏱️ ${o.prepMin+o.cookMin} دقيقة · لكل حصة: ${o.kcal} سعرة / ${o.p} بروتين / ${o.c} كارب</div>`;
  else if (r.t==='sn') h += `<div class="pmeta">${r.lbl} · لكل حصة: ${o.kcal} سعرة / ${o.p} بروتين / ${o.c} كارب</div>`;
  else if (r.t==='pr') h += `<div class="pmeta">${r.lbl} · لكل حصة: ${o.kcal} سعرة / ${o.P} بروتين / ${o.C} كارب</div>`;
  else if (r.t==='fr') h += `<div class="pmeta">${r.lbl} · ${o.meta.join(' · ')}${o.mac?` · لكل حصة: ${o.mac.kcal} سعرة / ${o.mac.p} بروتين / ${o.mac.c} كارب${o.mac.serves?` · تكفي ${o.mac.serves}`:''}`:''}</div>`;
  else if (r.t==='sc') h += `<div class="pmeta">${r.lbl} · لكل حصة (${o.serv}): ${o.kcal} سعرة / ${o.f} دهون / ${o.c} كارب · الدفعة ${o.yield}</div>`;
  else h += `<div class="pmeta">${r.lbl}</div>`;

  if (r.struct){
    h += `<h4>🧺 المكوّنات (مضروبة ×${n})</h4><ul>${scaledIngs(o, n)}</ul>`;
  } else if (o.ing){
    h += `<h4>🧺 المكوّنات — للوصفة الواحدة (حضّر ×${n})</h4><ul>${o.ing.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  } else if (o.d){
    h += `<div style="font-size:13px;color:var(--txt2)">${o.d}</div>`;
  }
  const steps = o.steps;
  if (steps) h += `<h4>👨‍🍳 الطريقة</h4><ol>${steps.map(s=>`<li>${s}</li>`).join('')}</ol>`;
  else if (o.how) h += `<h4>👨‍🍳 الطريقة</h4><div style="font-size:13px;color:var(--txt2)">${o.how}</div>`;
  if (r.t==='fz') h += `<div class="notebox">♨️ <b>التسخين:</b> ${o.reheat} · 📦 <b>التخزين:</b> ${o.store}</div>`;
  if (r.t==='pr' && o.store) h += `<div class="notebox">📦 ${o.store}</div>`;
  if (r.t==='sc' && o.keep) h += `<div class="notebox">📦 <b>التخزين:</b> ${o.keep}</div>`;
  return h + `</div>`;
}

// مستند الطباعة الاحترافي (مستقل عن تصميم الويب)
function buildPrintDoc(){
  const uids = Object.keys(state.plan);
  const items = uids.map(uid=>({uid, n:state.plan[uid], r:resolve(uid)})).filter(x=>x.r);
  const totServ = items.reduce((a,x)=>a+x.n,0);
  const totKcal = items.reduce((a,x)=>a+(x.r.o.kcal||0)*x.n,0);
  const ph = PHASES[state.phase];
  const dateStr = new Date().toLocaleDateString('ar-SA', {weekday:'long', year:'numeric', month:'long', day:'numeric'});

  let h = `<div class="pd-head">
    <div class="pd-logo">🥑 كيتو — دليلي الشامل</div>
    <h1>خطة التحضير الأسبوعية</h1>
    <div class="pd-meta"><span>📅 ${dateStr}</span><span>المرحلة: <b>${ph.emoji} ${ph.name}</b></span><span>${items.length} وصفات · ${totServ} حصة · ≈${totKcal.toLocaleString('en')} سعرة إجمالاً</span></div>
  </div>`;

  // جدول ملخص الخطة
  h += `<table class="pd-toc"><tr><th>#</th><th>الوصفة</th><th>القسم</th><th>الحصص</th><th>سعرات/حصة</th><th>بروتين/حصة</th></tr>`;
  items.forEach((x,i)=>{
    const o = x.r.o;
    const kc = o.kcal||(o.mac&&o.mac.kcal)||'—';
    const pr = o.p||o.P||(o.mac&&o.mac.p)||'—';
    h += `<tr><td class="c">${i+1}</td><td>${x.r.e} ${x.r.n}</td><td class="c">${x.r.lbl}</td><td class="c">×${x.n}</td><td class="c">${kc}</td><td class="c">${pr}</td></tr>`;
  });
  h += `</table>`;

  // أوراق التحضير
  h += `<h2 class="pd-sec">📖 أوراق التحضير</h2>`;
  items.forEach((x,i)=>{
    const o = x.r.o, n = x.n;
    let meta = [`<b>${x.r.lbl}</b>`];
    if (o.prepMin) meta.push(`⏱️ ${o.prepMin+o.cookMin} دقيقة`);
    if (o.meta) meta.push(o.meta.join(' · '));
    if (o.serv) meta.push(`حصة: <b>${o.serv}</b> · دفعة: ${o.yield}`);
    if (o.mac && o.mac.serves) meta.push(`تكفي <b>${o.mac.serves}</b> ${o.mac.serves>2?'حصص':'حصة'}`);
    if (o.kcal) meta.push(`للحصة: <b>${o.kcal}</b> سعرة · <b>${o.p||o.P}</b> بروتين · <b>${o.f||o.F}</b> دهون · <b>${o.c||o.C}</b> كارب`);
    else if (o.mac) meta.push(`للحصة: <b>${o.mac.kcal}</b> سعرة · <b>${o.mac.p}</b> بروتين · <b>${o.mac.f}</b> دهون · <b>${o.mac.c}</b> كارب`);
    if (o.difficulty) meta.push(o.difficulty);

    let ingHtml = '';
    if (x.r.struct){
      ingHtml = o.ingredients.map(ing=>{
        const m = ING[ing.key]; if (!m) return '';
        return `<li><span>${m.name}</span><span class="ia">${fmtTotal(ing.amt*n, m.unit)}</span></li>`;
      }).join('');
    } else if (o.ing){
      ingHtml = o.ing.map(t=>`<li><span>${t}</span></li>`).join('');
    } else if (o.d){
      ingHtml = `<li><span>${o.d}</span></li>`;
    }
    const ingTitle = x.r.struct ? `🧺 المكوّنات (مضروبة ×${n})` : `🧺 المكوّنات — للمرة الواحدة (حضّر ×${n})`;
    const steps = o.steps ? o.steps : (o.how ? [o.how] : (o.desc ? [o.desc] : []));
    const cols = steps.length
      ? `<div class="pd-cols">
          <div class="pd-ing"><h4>${ingTitle}</h4><ul>${ingHtml}</ul></div>
          <div class="pd-steps"><h4>👨‍🍳 طريقة التحضير</h4><ol>${steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>
        </div>`
      : `<div class="pd-ing" style="border:none"><h4>${ingTitle}</h4><ul>${ingHtml}</ul></div>`;

    h += `<article class="pd-recipe">
      <div class="pd-rhead"><span class="pd-num">${i+1}</span><span>${x.r.e}</span><span class="pd-rname">${x.r.n}</span><span class="pd-serv">×${n} ${n>2?'حصص':'حصة'}</span></div>
      <div class="pd-rmeta">${meta.map(m=>`<span>${m}</span>`).join('')}</div>
      ${cols}
      ${o.altMethod?`<div class="pd-note">🔁 <b>طريقة بديلة:</b> ${o.altMethod}</div>`:''}
      ${x.r.t==='fz'?`<div class="pd-note">♨️ <b>التسخين:</b> ${o.reheat} &nbsp;·&nbsp; 📦 <b>التخزين:</b> ${o.store}</div>`:''}
      ${x.r.t==='pr'&&o.store?`<div class="pd-note">📦 ${o.store}</div>`:''}
      ${x.r.t==='sc'&&o.keep?`<div class="pd-note">📦 <b>التخزين:</b> ${o.keep}</div>`:''}
    </article>`;
  });

  // قائمة التسوق
  h += `<h2 class="pd-sec pd-break">🛒 قائمة التسوق</h2>
  <div class="pd-shopintro">الكميات محسوبة بالضبط لمجموع الحصص أعلاه — الأصناف المشطوبة متوفرة في المنزل ولا تُشترى.</div>
  <div class="pd-shopwrap">`;
  const agg = {};
  items.forEach(x=>{
    if (!x.r.struct) return;
    x.r.o.ingredients.forEach(ing=>{
      const m = ING[ing.key]; if (!m) return;
      if (!agg[ing.key]) agg[ing.key] = { m, total:0 };
      agg[ing.key].total += ing.amt * x.n;
    });
  });
  const CATS = ['بروتين','ألبان وأجبان','دهون','خضار','مكسرات','بهارات وصلصات'];
  for (const cat of CATS){
    const list = Object.entries(agg).filter(([k,v])=>v.m.cat===cat);
    if (!list.length) continue;
    h += `<div class="pd-cat"><h3>${cat}</h3>` + list.map(([k,v])=>{
      const hv = haveSet.has('g:'+k);
      return `<div class="pd-line ${hv?'have':''}"><span class="pd-box">${hv?'✓':''}</span><span>${v.m.name}</span><span class="pd-amt">${fmtTotal(v.total, v.m.unit)}</span></div>`;
    }).join('') + `</div>`;
  }
  const textOnes = items.filter(x=>!x.r.struct);
  if (textOnes.length){
    h += `<div class="pd-cat"><h3>حسب الوصفة</h3>`;
    for (const x of textOnes){
      const lines = x.r.o.ing || (x.r.o.d ? [x.r.o.d] : []);
      for (const line of lines){
        const key = 't:'+x.r.n+':'+line;
        const hv = haveSet.has(key);
        h += `<div class="pd-line ${hv?'have':''}"><span class="pd-box">${hv?'✓':''}</span><span>${line} <span class="pd-lnote">(${x.r.n} ×${x.n})</span></span></div>`;
      }
    }
    h += `</div>`;
  }
  h += `</div><div class="pd-foot"><span>أُعدّت بواسطة «كيتو — دليلي الشامل» · musa85.github.io/keto</span><span>${dateStr}</span></div>`;

  const doc = $('#printdoc');
  doc.style.setProperty('--pacc', PHASE_COLORS[state.phase][0]);
  doc.innerHTML = h;
}

// طباعة الخطة — نُبقي صنف pp مفعّلاً حتى تنتهي الطباعة فعلاً.
// (في كروم/بريف بالجوال window.print() غير محظور؛ حذف pp فوراً بعده كان
//  يطبع الصفحة الحالية. نعتمد afterprint مع بديل matchMedia لسفاري/الجوال.)
function printPlan(){
  if (!Object.keys(state.plan).length){ toast('الخطة فارغة — أضف وصفات أولاً 🛒'); return; }
  buildPrintDoc();
  document.body.classList.add('pp');
  let cleaned = false;
  const cleanup = () => {
    if (cleaned) return; cleaned = true;
    document.body.classList.remove('pp');
    window.removeEventListener('afterprint', cleanup);
    if (mql){ mql.removeEventListener ? mql.removeEventListener('change', onMedia) : mql.removeListener(onMedia); }
  };
  const onMedia = m => { if (!m.matches) cleanup(); };
  const mql = window.matchMedia ? window.matchMedia('print') : null;
  window.addEventListener('afterprint', cleanup);
  if (mql){ mql.addEventListener ? mql.addEventListener('change', onMedia) : mql.addListener(onMedia); }
  setTimeout(()=>{ try { window.print(); } catch(e){ cleanup(); } }, 120);
}

function renderPlan(){
  const uids = Object.keys(state.plan);
  let h = `<h2 class="sec-title">🖨️ خطة التحضير</h2>`;
  if (!uids.length){
    h += `<p class="sec-sub">اختر وصفاتك من بقية التبويبات بزر <b style="color:var(--acc)">🛒 + للخطة</b> — مثلاً: وصفتا تجميد ×5 حصص لأسبوع العمل + سناكات + سلطة. ثم ارجع هنا لتجد أوراق التحضير بالكميات المضروبة وقائمة تسوق مجمّعة، تشطب منها المتوفر عندك بالبيت وتطبع الباقي.</p>
    <div class="empty">الخطة فارغة — ابدأ بإضافة وصفات 🛒</div>`;
    $('#pane-plan').innerHTML = h; return;
  }

  // ما اخترته (تفاعلي، لا يُطبع)
  h += `<div class="noprint"><p class="sec-sub">عدّل الحصص (مثلاً 5 = وجبة يومياً لأسبوع عمل)، اشطب المتوفر بالبيت من قائمة التسوق، ثم اطبع.</p>`;
  h += uids.map(uid=>{
    const r = resolve(uid); if (!r) return '';
    return `<div class="planrow"><span>${r.e}</span>
      <div class="pn">${r.n}<div class="pt">${r.lbl}</div></div>
      <div class="pstep"><button data-pdec="${uid}">−</button><b>${state.plan[uid]}</b><button data-pinc="${uid}">+</button></div>
      <button class="prem" data-prem="${uid}" title="إزالة">✕</button></div>`;
  }).join('');
  h += `<div class="plansum">
    <button class="abtn" data-print="1">🖨️ اطبع الخطة</button>
    <button class="abtn ghost" data-clearplan="1">🧹 مسح الخطة</button>
  </div></div>`;

  // إجمالي الماكروز اليومية التقريبية؟ (مجموع الحصص الكلي)
  let tk=0;
  uids.forEach(uid=>{ const r=resolve(uid); if(r&&(r.o.kcal)) tk += (r.o.kcal)*state.plan[uid]; });

  // أوراق التحضير
  h += `<h2 class="sec-title">📖 أوراق التحضير</h2>`;
  h += uids.map(uid=>prepBlock(uid, state.plan[uid])).join('');

  // قائمة التسوق المجمّعة
  h += `<h2 class="sec-title">🛒 قائمة التسوق</h2>
  <div class="havehint noprint">اضغط على أي صنف <b>متوفر عندك بالبيت</b> ليُشطب — تشتري الباقي فقط بالكميات المحسوبة بالضبط، بلا هدر.</div>`;
  const agg = {};
  uids.forEach(uid=>{
    const r = resolve(uid); if (!r || !r.struct) return;
    r.o.ingredients.forEach(ing=>{
      const m = ING[ing.key]; if (!m) return;
      if (!agg[ing.key]) agg[ing.key] = { m, total:0 };
      agg[ing.key].total += ing.amt * state.plan[uid];
    });
  });
  const CAT_ORDER = ['بروتين','ألبان وأجبان','دهون','خضار','مكسرات','بهارات وصلصات'];
  for (const cat of CAT_ORDER){
    const items = Object.entries(agg).filter(([k,v])=>v.m.cat===cat);
    if (!items.length) continue;
    h += `<div class="shopcat"><div class="sct">${cat}</div>` + items.map(([k,v])=>{
      const hv = haveSet.has('g:'+k);
      return `<div class="shopline ${hv?'have':''}" data-have="g:${k}"><span class="box">${hv?'✓':''}</span><span class="st">${v.m.name}</span><span class="samt">${fmtTotal(v.total, v.m.unit)}</span></div>`;
    }).join('') + `</div>`;
  }
  // مكوّنات الوصفات النصية (مباشر/بروتين/مكمّلات)
  const textOnes = uids.map(uid=>({uid, r:resolve(uid)})).filter(x=>x.r && !x.r.struct);
  if (textOnes.length){
    h += `<div class="shopcat"><div class="sct">حسب الوصفة (راجع الكميات في أوراق التحضير)</div>`;
    for (const {uid, r} of textOnes){
      const lines = r.o.ing || (r.o.d ? [r.o.d] : []);
      for (const line of lines){
        const key = 't:'+r.n+':'+line;
        const hv = haveSet.has(key);
        h += `<div class="shopline ${hv?'have':''}" data-have="${key}"><span class="box">${hv?'✓':''}</span><span class="st">${line} <span class="alts">(${r.n} ×${state.plan[uid]})</span></span></div>`;
      }
    }
    h += `</div>`;
  }
  h += `<div class="havehint" style="margin-top:14px">📅 خطة بتاريخ: ${new Date().toLocaleDateString('ar-SA')} · إجمالي حصص الخطة ≈ ${tk.toLocaleString('en')} سعرة</div>`;
  $('#pane-plan').innerHTML = h;
}

// ============================================================
// التحديث والأحداث
// ============================================================
const RENDER = { journey:renderJourney, freezer:renderFreezer, fresh:renderFresh, sides:renderSides, sauces:renderSauces, protein:renderProtein, snacks:renderSnacks, hacks:renderHacks, plan:renderPlan };
function renderActive(){ renderTabs(); RENDER[state.tab](); }
function renderAll(){ applyPhase(); renderActive(); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-phase],[data-tab],[data-fav],[data-plan],[data-pinc],[data-pdec],[data-prem],[data-have],[data-print],[data-clearplan],[data-jsec],[data-card] .chead,[data-card] .cbadges,[data-card] .macros,[data-fzbase],[data-fztog],[data-frcat],[data-prbase],[data-prtype],[data-prfast],[data-sncat],[data-sccat],[data-gstatus]');
  if (!t) return;

  if (t.dataset.jsec){
    const id = t.dataset.jsec;
    journeyOpen.has(id) ? journeyOpen.delete(id) : journeyOpen.add(id);
    renderJourney(); return;
  }

  if (t.dataset.plan){
    const uid = t.dataset.plan;
    if (state.plan[uid]){ delete state.plan[uid]; toast('أُزيلت من الخطة'); }
    else { state.plan[uid] = 1; toast('أُضيفت للخطة 🛒 — عدّل الحصص من تبويب خطة التحضير'); }
    save(); renderActive(); return;
  }
  if (t.dataset.pinc){ state.plan[t.dataset.pinc]++; save(); renderPlan(); renderTabs(); return; }
  if (t.dataset.pdec){ const u=t.dataset.pdec; state.plan[u] = Math.max(1, state.plan[u]-1); save(); renderPlan(); return; }
  if (t.dataset.prem){ delete state.plan[t.dataset.prem]; save(); renderPlan(); renderTabs(); return; }
  if (t.dataset.have){
    const k = t.dataset.have;
    haveSet.has(k) ? haveSet.delete(k) : haveSet.add(k);
    state.have = [...haveSet]; save(); renderPlan(); return;
  }
  if (t.dataset.print){ printPlan(); return; }
  if (t.dataset.clearplan){
    state.plan = {}; haveSet.clear(); state.have = [];
    save(); renderPlan(); renderTabs(); toast('تم مسح الخطة'); return;
  }

  if (t.dataset.fav){
    const uid = t.dataset.fav;
    if (favSet.has(uid)){ favSet.delete(uid); toast('أُزيلت من المفضلة'); }
    else { favSet.add(uid); toast('أُضيفت للمفضلة ⭐'); }
    state.favs = [...favSet]; save();
    t.classList.toggle('on'); t.textContent = favSet.has(uid)?'⭐':'☆';
    return;
  }
  if (t.dataset.phase){ state.phase = t.dataset.phase; save(); renderAll(); return; }
  if (t.dataset.tab){ state.tab = t.dataset.tab; save(); renderActive(); window.scrollTo({top:0}); return; }
  if (t.dataset.gstatus){ guideStatus = t.dataset.gstatus; renderJourney(); return; }
  if (t.dataset.fzbase){ fzBase = t.dataset.fzbase; renderFreezer(); return; }
  if (t.dataset.fztog){
    const k = t.dataset.fztog;
    if (k==='phase') fzPhaseOnly = !fzPhaseOnly;
    if (k==='odor') fzOdorLow = !fzOdorLow;
    if (k==='stove') fzEquip = fzEquip==='stove' ? 'all' : 'stove';
    if (k==='oven') fzEquip = fzEquip==='oven' ? 'all' : 'oven';
    if (k==='micro') fzEquip = fzEquip==='micro' ? 'all' : 'micro';
    renderFreezer(); return;
  }
  if (t.dataset.frcat){ frCat = t.dataset.frcat; renderFresh(); return; }
  if (t.dataset.sncat){ snCat = t.dataset.sncat; renderSnacks(); return; }
  if (t.dataset.sccat){ scCat = t.dataset.sccat; renderSauces(); return; }
  if (t.dataset.prbase){ prBase = t.dataset.prbase; renderProtein(); return; }
  if (t.dataset.prtype){ prType = t.dataset.prtype; renderProtein(); return; }
  if (t.dataset.prfast){ prFast = !prFast; renderProtein(); return; }

  const card = t.closest('[data-card]');
  if (card) card.classList.toggle('open');
});

$('#q').addEventListener('input', e => { q = e.target.value.trim(); RENDER[state.tab](); });
$('#favOnly').addEventListener('click', () => {
  state.favOnly = !state.favOnly; save();
  $('#favOnly').classList.toggle('on', state.favOnly);
  RENDER[state.tab]();
});
$('#favOnly').classList.toggle('on', state.favOnly);

const topbtn = $('#topbtn');
const navbar = $('.navbar');
let lastY = 0;
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  topbtn.classList.toggle('show', y > 600);
  // في الجوال: إخفاء الشريط عند النزول وإظهاره عند السحب لأعلى (الـ CSS يفعّله ≤768px فقط)
  if (y > lastY + 6 && y > 250) navbar.classList.add('navhide');
  else if (y < lastY - 6 || y <= 250) navbar.classList.remove('navhide');
  lastY = y;
}, {passive:true});
topbtn.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));

renderAll();
</script>
</body>
</html>
