<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كيتو — دليلي الشامل</title>
<meta name="description" content="دليل كيتو عربي شامل: رحلة المراحل الثلاث، وصفات التجميد للعمل، الطبخ المباشر، مكمّلات الوجبات، وسناكات البروتين.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Cairo:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F0D0A; --bg2:#171410; --card:#1C1813; --card2:#242019; --line:#2E2820; --line2:#3A332A;
  --txt:#EDE6DA; --txt2:#B5AA98; --txt3:#7E7565;
  --strict:#C85A4A; --strict-glow:rgba(200,90,74,.16);
  --normal:#E8A33D; --normal-glow:rgba(232,163,61,.16);
  --lifestyle:#7FA86B; --lifestyle-glow:rgba(127,168,107,.16);
  --acc:#E8A33D; --acc-glow:rgba(232,163,61,.16);
  --ok:#7FA86B; --warn:#E8A33D; --bad:#C85A4A;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Cairo',sans-serif;font-size:15px;line-height:1.7;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(1100px 500px at 85% -10%,var(--acc-glow),transparent 60%);pointer-events:none;z-index:0;transition:background .5s}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px 80px;position:relative;z-index:1}
h1,h2,h3,h4{font-family:'Reem Kufi',sans-serif;line-height:1.5}
.mono{font-family:'JetBrains Mono',monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::placeholder{color:var(--txt3)}

/* ===== Header ===== */
header{padding:34px 0 10px;text-align:center}
.logo{font-family:'Reem Kufi',sans-serif;font-size:30px;font-weight:700;letter-spacing:.5px}
.logo .k{color:var(--acc);transition:color .4s}
.tagline{color:var(--txt2);font-size:13.5px;margin-top:2px}
.phase-switch{display:flex;justify-content:center;gap:8px;margin:18px 0 4px;flex-wrap:wrap}
.phase-switch .lbl{width:100%;font-size:12px;color:var(--txt3);margin-bottom:-2px}
.pbtn{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--txt2);font-size:13.5px;font-weight:600;transition:.25s}
.pbtn:hover{border-color:var(--line2);color:var(--txt)}
.pbtn.on{color:var(--txt);border-color:var(--pc);background:linear-gradient(0deg,var(--pg),var(--pg)),var(--card);box-shadow:0 0 18px var(--pg)}
.pbtn .dot{width:9px;height:9px;border-radius:50%;background:var(--pc)}
.pbtn.on .dot{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--pg)}50%{box-shadow:0 0 0 6px transparent}}
.phase-note{max-width:640px;margin:10px auto 0;font-size:13px;color:var(--txt2);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 16px}

/* ===== Nav ===== */
.navbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,var(--bg) 75%,transparent);padding:10px 0 12px;margin-top:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt2);font-size:13.5px;font-weight:600;transition:.2s;white-space:nowrap}
.tab:hover{color:var(--txt);border-color:var(--line2)}
.tab.on{color:var(--txt);border-color:var(--acc);background:linear-gradient(0deg,var(--acc-glow),var(--acc-glow)),var(--card)}
.tab .n{font-size:11px;color:var(--txt3);background:var(--bg);padding:0 7px;border-radius:8px}
.searchrow{display:flex;gap:8px;margin-top:9px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:14px}
.favtoggle{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt2);font-size:13px;font-weight:600;transition:.2s}
.favtoggle.on{color:#F4C95D;border-color:#F4C95D55;background:#F4C95D11}

/* ===== Sections ===== */
.pane{display:none;animation:fadein .25s}
.pane.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-title{display:flex;align-items:center;gap:10px;font-size:20px;margin:30px 0 6px}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(270deg,transparent,var(--line2))}
.sec-sub{color:var(--txt2);font-size:13.5px;margin-bottom:14px;max-width:760px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.fchip{padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--txt2);font-size:12.5px;font-weight:600;transition:.2s}
.fchip:hover{color:var(--txt)}
.fchip.on{color:var(--txt);border-color:var(--acc);background:linear-gradient(0deg,var(--acc-glow),var(--acc-glow)),var(--card)}
.empty{text-align:center;color:var(--txt3);padding:40px 0;font-size:14px}

/* ===== Cards grid ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .2s}
.card:hover{border-color:var(--line2)}
.card.open{border-color:var(--acc)}
.chead{display:flex;align-items:flex-start;gap:11px;padding:14px 15px 4px;cursor:pointer}
.cemoji{font-size:26px;line-height:1.2;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.cname{font-weight:700;font-size:15px;line-height:1.45}
.cdesc{font-size:12.5px;color:var(--txt2);line-height:1.55;margin-top:2px}
.cfav{margin-inline-start:auto;font-size:17px;opacity:.35;transition:.2s;padding:2px 4px}
.cfav:hover{opacity:.8;transform:scale(1.12)}
.cfav.on{opacity:1}
.cbadges{display:flex;flex-wrap:wrap;gap:5px;padding:9px 15px 0;cursor:pointer}
.chip{font-size:11px;font-weight:600;padding:2.5px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--txt2);background:var(--bg2)}
.chip.acc{color:var(--acc);border-color:var(--acc)}
.chip.ok{color:var(--ok);border-color:#7FA86B55;background:rgba(127,168,107,.08)}
.chip.warn{color:var(--warn);border-color:#E8A33D55;background:rgba(232,163,61,.08)}
.chip.bad{color:var(--bad);border-color:#C85A4A55;background:rgba(200,90,74,.08)}
.chip.whey{color:#8FB7D9;border-color:#8FB7D955;background:#8FB7D911}
.chip.beef{color:#C98FD9;border-color:#C98FD955;background:#C98FD911}
.macros{display:flex;gap:6px;padding:10px 15px 13px;cursor:pointer}
.mx{flex:1;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:5px 2px}
.mx b{display:block;font-family:'JetBrains Mono',monospace;font-size:13.5px;color:var(--txt)}
.mx span{font-size:10px;color:var(--txt3)}
.mx.kc b{color:var(--acc)}
.cbody{display:none;border-top:1px dashed var(--line2);padding:13px 15px 15px;font-size:13px}
.card.open .cbody{display:block}
.cbody h4{font-size:12.5px;color:var(--acc);margin:10px 0 5px;display:flex;align-items:center;gap:6px}
.cbody h4:first-child{margin-top:0}
.cbody ul,.cbody ol{padding-inline-start:20px;display:grid;gap:3px;color:var(--txt2)}
.cbody ol li::marker{color:var(--acc);font-weight:700}
.cbody ul li::marker{color:var(--txt3)}
.alts{font-size:11.5px;color:var(--txt3)}
.notebox{margin-top:11px;background:var(--bg2);border:1px solid var(--line);border-inline-start:3px solid var(--acc);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--txt2)}
.pairrow{margin-top:11px;font-size:12.5px;color:var(--txt2)}
.pairrow b{color:var(--txt)}

/* ===== Journey ===== */
.jgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.jcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden;transition:.25s}
.jcard::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--jc)}
.jcard.cur{border-color:var(--jc);box-shadow:0 0 24px var(--jg)}
.jcard .jph{display:flex;align-items:center;gap:9px;font-family:'Reem Kufi',sans-serif;font-size:17px;font-weight:700}
.jcard .jgoal{display:inline-block;margin:8px 0;font-size:11.5px;font-weight:700;color:var(--jc);border:1px solid var(--jc);border-radius:99px;padding:2px 11px}
.jcard p{font-size:13px;color:var(--txt2)}
.jcard .jdur{margin-top:10px;font-size:12px;color:var(--txt3)}
.jcard .jdur b{color:var(--txt2)}
.jcard .youare{position:absolute;top:12px;inset-inline-end:14px;font-size:10.5px;font-weight:700;color:var(--jc);background:var(--jg);padding:2px 10px;border-radius:99px}
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.sign{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px}
.sign .se{font-size:20px}
.sign b{display:block;font-size:13px}
.sign span{color:var(--txt2);font-size:12px;line-height:1.55}
.gitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.gitem .gn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;flex-wrap:wrap}
.gpills{display:flex;gap:5px;margin-inline-start:auto;flex-wrap:wrap}
.gpill{font-size:10.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);background:var(--bg2);display:flex;gap:4px;align-items:center}
.gpill .pl{color:var(--txt3)}
.gpill.focus{border-color:var(--acc)}
.gpill.dim{opacity:.55}
.pv-yes{color:var(--ok);font-weight:700}.pv-cond{color:var(--warn);font-weight:700}.pv-no{color:var(--bad);font-weight:700}
.gcond{font-size:12px;color:var(--txt2);margin-top:5px}
.gcond .ck{color:var(--warn);font-weight:700}
.gphase{font-size:12px;margin-top:5px;color:var(--txt2);background:var(--bg2);border-radius:8px;padding:5px 10px;border-inline-start:3px solid var(--acc)}
.gcat-title{display:flex;align-items:center;gap:8px;font-size:15px;margin:20px 0 8px;color:var(--txt)}
.glist{display:grid;gap:8px}
.swap{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.swap .sfrom,.swap .sto{text-align:center;font-size:13px;font-weight:700}
.swap .sfrom{color:var(--bad)}
.swap .sto{color:var(--ok)}
.swap .sarrow{color:var(--txt3);font-size:18px}
.swap .show-{grid-column:1/-1;font-size:12.5px;color:var(--txt2);border-top:1px dashed var(--line);padding-top:9px}
.swap .sk{color:var(--acc);font-weight:700}
.swapcat{font-size:13.5px;color:var(--txt2);margin:18px 0 8px;font-weight:700}

/* ===== Sides ===== */
.sgroup-title{display:flex;align-items:center;gap:9px;font-size:16px;margin:24px 0 10px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.scard .sn{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.scard .sd{font-size:12.5px;color:var(--txt2);margin-top:3px}
.scard .show{font-size:12px;color:var(--txt2);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.scard .show b{color:var(--acc)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;align-items:start}

/* ===== Shopping ===== */
.shopwrap{margin-top:26px}
details.shop{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
details.shop summary{cursor:pointer;padding:13px 16px;font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:9px;list-style:none}
details.shop summary::-webkit-details-marker{display:none}
details.shop summary::after{content:'⌄';margin-inline-start:auto;color:var(--txt3);transition:.2s}
details.shop[open] summary::after{transform:rotate(180deg)}
.shopitem{border-top:1px solid var(--line);padding:11px 16px}
.shopitem .in{font-weight:700;font-size:13.5px}
.shopitem .iq{color:var(--txt3);font-size:12px;font-weight:400}
.shopitem .ia{font-size:12px;color:var(--txt2);margin-top:2px}
.shopitem .iw{font-size:12px;color:var(--txt2);margin-top:2px}
.shopitem .iw .bad{color:var(--bad);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.tool{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 13px;color:var(--txt2)}

/* ===== Misc ===== */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card2);border:1px solid var(--acc);color:var(--txt);padding:10px 22px;border-radius:99px;font-size:13.5px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
footer{margin-top:60px;text-align:center;color:var(--txt3);font-size:12.5px;border-top:1px solid var(--line);padding-top:22px}
footer a{color:var(--txt2)}
.topbtn{position:fixed;bottom:22px;inset-inline-end:18px;width:42px;height:42px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);color:var(--txt2);font-size:18px;z-index:60;opacity:0;transition:.3s;pointer-events:none}
.topbtn.show{opacity:1;pointer-events:auto}
@media(max-width:560px){
  .grid{grid-template-columns:1fr}
  .card.open{grid-row:auto}
  .swap{grid-template-columns:1fr;gap:4px}
  .swap .sarrow{transform:rotate(90deg)}
  header{padding-top:24px}
  .logo{font-size:25px}
}
@media print{
  body::before,.navbar,.topbtn,.toast,.cfav{display:none!important}
  body{background:#fff;color:#000}
  .pane{display:block!important}
  .card,.cbody{display:block!important;border-color:#ccc}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo">🥑 كيتو <span class="k">—</span> دليلي الشامل</div>
  <div class="tagline">رحلتي من الكيتو الصارم إلى نمط الحياة — وصفات، تجميد، سناكات، وكل ما أحتاجه في مكان واحد</div>
  <div class="phase-switch" id="phaseSwitch">
    <div class="lbl">مرحلتي الحالية:</div>
  </div>
  <div class="phase-note" id="phaseNote"></div>
</header>

<nav class="navbar">
  <div class="tabs" id="tabs"></div>
  <div class="searchrow">
    <div class="search">🔍 <input id="q" type="search" placeholder="ابحث في القسم الحالي… (وصفة، مكوّن، كلمة)"></div>
    <button class="favtoggle" id="favOnly">⭐ المفضلة</button>
  </div>
</nav>

<main>
  <section class="pane" id="pane-journey"></section>
  <section class="pane" id="pane-freezer"></section>
  <section class="pane" id="pane-fresh"></section>
  <section class="pane" id="pane-sides"></section>
  <section class="pane" id="pane-protein"></section>
  <section class="pane" id="pane-snacks"></section>
</main>

<footer>
  صُمم لرحلة موسى مع الكيتو · ٢٠٢٦ · يعمل بدون إنترنت ويحفظ تفضيلاتك في متصفحك<br>
  المحتوى إرشادي ولا يغني عن استشارة مختص التغذية
</footer>

</div>
<button class="topbtn" id="topbtn" title="للأعلى">↑</button>
<div class="toast" id="toast"></div>

<script>

const $ = s => document.querySelector(s);
const FRAC = {0.25:'¼', 0.5:'½', 0.75:'¾'};
function amtTxt(a){
  if (FRAC[a]) return FRAC[a];
  if (a % 1 !== 0){ const w = Math.floor(a), f = FRAC[+(a-w).toFixed(2)]; if (f) return (w?w:'')+f; }
  return String(a);
}
function ingLine(ing){
  const m = ING[ing.key]; if (!m) return '';
  let t = `<li><b>${m.name}</b> — ${amtTxt(ing.amt)} ${m.unit}`;
  if (ing.alts && ing.alts.length){
    t += `<br><span class="alts">أو: ${ing.alts.map(k=>ING[k]?ING[k].name:k).join('، ')}</span>`;
  }
  return t + '</li>';
}
function macroRow(kcal,p,f,c){
  return `<div class="macros">
    <div class="mx kc"><b>${kcal}</b><span>سعرة</span></div>
    <div class="mx"><b>${p}</b><span>بروتين</span></div>
    <div class="mx"><b>${f}</b><span>دهون</span></div>
    <div class="mx"><b>${c}</b><span>كارب صافٍ</span></div>
  </div>`;
}
function favBtn(uid){
  return `<button class="cfav ${favSet.has(uid)?'on':''}" data-fav="${uid}" title="مفضلة">${favSet.has(uid)?'⭐':'☆'}</button>`;
}

}

  const el = $('#toast'); el.textContent = msg;
  el.classList.add('show'); clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 1700);
}
function hit(txt){ return !q || (txt||'').includes(q); }
function chipRow(defs, cur, attr){
  return `<div class="chips">` + defs.map(d =>
    `<button class="fchip ${cur===d.v?'on':''}" data-${attr}="${d.v}">${d.t}</button>`).join('') + `</div>`;
}

function applyPhase(){
  const [c, g] = PHASE_COLORS[state.phase];
  document.documentElement.style.setProperty('--acc', c);
  document.documentElement.style.setProperty('--acc-glow', g);
  const sw = $('#phaseSwitch');
  sw.innerHTML = `<div class="lbl">مرحلتي الحالية:</div>` + Object.values(PHASES).map(p=>{
    const [pc,pg] = PHASE_COLORS[p.key];
    return `<button class="pbtn ${state.phase===p.key?'on':''}" data-phase="${p.key}" style="--pc:${pc};--pg:${pg}">
      <span class="dot"></span> ${p.emoji} ${p.name}</button>`;
  }).join('');
  $('#phaseNote').innerHTML = `<b>${PHASES[state.phase].goal}:</b> ${PHASES[state.phase].note}`;
}

      <span class="jgoal">${p.goal}</span>
      <p>${p.note}</p>
      <div class="jdur">${PHASE_DUR[p.key]}</div>
    </div>`;
  }).join('') + `</div>`;

  h += `<h2 class="sec-title">🔁 متى أنتقل بين المراحل؟</h2><div class="signs">` +
    TRANSITIONS.map(t=>`<div class="sign"><span class="se">${t.e}</span><div><b>${t.n}</b><span>${t.d}</span></div></div>`).join('') + `</div>`;

  h += `<h2 class="sec-title">🧪 علامات دخول الكيتوزس</h2><div class="signs">` +
    KETO_SIGNS.map(s=>`<div class="sign"><span class="se">${s.e}</span><div><b>${s.n}</b><span>${s.d}</span></div></div>`).join('') + `</div>`;

  h += `<h2 class="sec-title">🤒 إنفلونزا الكيتو وعلاجها</h2><div class="signs">` +
    KETO_FLU.map(s=>`<div class="sign"><span class="se">${s.e}</span><div><b>${s.n}</b><span>${s.d}</span></div></div>`).join('') + `</div>`;

  // دليل المسموح والممنوع
  h += `<h2 class="sec-title">📋 دليل المسموح والممنوع</h2>
  <p class="sec-sub">الحكم الملوّن حسب مرحلتك الحالية (${PHASES[state.phase].emoji} ${PHASES[state.phase].name}). ✓ مسموح · ⚠ مشروط · ✕ ممنوع.</p>`;
  h += chipRow([
    {v:'all',t:'الكل'},{v:'y',t:'✓ المسموح'},{v:'c',t:'⚠ المشروط'},{v:'n',t:'✕ الممنوع'}
  ], guideStatus, 'gstatus');

  for (const [ck, cat] of Object.entries(GUIDE_CATS)){
    const items = GUIDE_DATA.filter(it => it.cat===ck
      && (guideStatus==='all' || it.s[state.phase]===guideStatus)
      && (hit(it.n) || hit(it.cond)));

    h += `<h3 class="gcat-title">${cat.e} ${cat.n}</h3><div class="glist">` + items.map(it=>{
      const pills = Object.keys(GUIDE_PHASES).map(k=>{

        return `<span class="gpill ${k===state.phase?'focus':'dim'}"><span class="pl">${short}</span> <span class="pv-${m.cls}">${m.sym}</span></span>`;
      }).join('');
      const pc = it.pc && it.pc[state.phase] ? `<div class="gphase">💡 ${it.pc[state.phase]}</div>` : '';

      <div class="show-">${s.how}</div>

  $('#pane-journey').innerHTML = h;

const RENDER = { journey:renderJourney, freezer:renderFreezer, fresh:renderFresh, sides:renderSides, protein:renderProtein, snacks:renderSnacks };
function renderActive(){ renderTabs(); RENDER[state.tab](); }
function renderAll(){ applyPhase(); renderActive(); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-phase],[data-tab],[data-fav],[data-card] .chead,[data-card] .cbadges,[data-card] .macros,[data-fzbase],[data-fztog],[data-frcat],[data-prbase],[data-prtype],[data-prfast],[data-gstatus]');
  if (!t) return;

  if (t.dataset.fav){
    const uid = t.dataset.fav;
    if (favSet.has(uid)){ favSet.delete(uid); toast('أُزيلت من المفضلة'); }
    else { favSet.add(uid); toast('أُضيفت للمفضلة ⭐'); }
    state.favs = [...favSet]; save();
    t.classList.toggle('on'); t.textContent = favSet.has(uid)?'⭐':'☆';
    return;
  }
  if (t.dataset.phase){ state.phase = t.dataset.phase; save(); renderAll(); return; }
  if (t.dataset.tab){ state.tab = t.dataset.tab; save(); renderActive(); window.scrollTo({top:0}); return; }
  if (t.dataset.gstatus){ guideStatus = t.dataset.gstatus; renderJourney(); return; }
  if (t.dataset.fzbase){ fzBase = t.dataset.fzbase; renderFreezer(); return; }
  if (t.dataset.fztog){
    const k = t.dataset.fztog;
    if (k==='phase') fzPhaseOnly = !fzPhaseOnly;
    if (k==='odor') fzOdorLow = !fzOdorLow;
    if (k==='stove') fzEquip = fzEquip==='stove' ? 'all' : 'stove';
    if (k==='oven') fzEquip = fzEquip==='oven' ? 'all' : 'oven';
    renderFreezer(); return;
  }
  if (t.dataset.frcat){ frCat = t.dataset.frcat; renderFresh(); return; }
  if (t.dataset.prbase){ prBase = t.dataset.prbase; renderProtein(); return; }
  if (t.dataset.prtype){ prType = t.dataset.prtype; renderProtein(); return; }
  if (t.dataset.prfast){ prFast = !prFast; renderProtein(); return; }

  const card = t.closest('[data-card]');
  if (card) card.classList.toggle('open');
});

$('#q').addEventListener('input', e => { q = e.target.value.trim(); RENDER[state.tab](); });
$('#favOnly').addEventListener('click', () => {
  state.favOnly = !state.favOnly; save();
  $('#favOnly').classList.toggle('on', state.favOnly);
  RENDER[state.tab]();
});
$('#favOnly').classList.toggle('on', state.favOnly);
